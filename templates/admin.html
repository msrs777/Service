<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin - Bhubaneswar Home Services</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
</head>

<body>

<header class="admin-header">

    <div>
        <h1>🏠 Bhubaneswar Home Services</h1>
        <p>Admin Dashboard</p>
    </div>

    <a href="/" class="customer-link">
        View Customer Site
    </a>

</header>


<main class="container">

    <div class="page-title">

        <div>
            <h2>Service Bookings</h2>
            <p>Manage customer service requests.</p>
        </div>

        <button onclick="loadBookings()" class="refresh-btn">
            🔄 Refresh
        </button>

    </div>


    <div class="stats">

        <div class="stat-card">
            <span>Total</span>
            <strong id="totalBookings">0</strong>
        </div>

        <div class="stat-card">
            <span>Pending</span>
            <strong id="pendingBookings">0</strong>
        </div>

        <div class="stat-card">
            <span>Confirmed</span>
            <strong id="confirmedBookings">0</strong>
        </div>

        <div class="stat-card">
            <span>Completed</span>
            <strong id="completedBookings">0</strong>
        </div>

    </div>


    <div class="table-container">

        <table>

            <thead>

                <tr>
                    <th>ID</th>
                    <th>Customer</th>
                    <th>Phone</th>
                    <th>Service</th>
                    <th>Date</th>
                    <th>Time</th>
                    <th>Address</th>
                    <th>Status</th>
                </tr>

            </thead>

            <tbody id="bookingTable">

                <tr>
                    <td colspan="8">
                        Loading bookings...
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

</main>


<script src="{{ url_for('static', filename='admin.js') }}"></script>

</body>
</html>
